<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dashboard · Revomaker System Share</title><link rel="stylesheet" href="/style.css"></head>
<body><video id="bgv" src="/bg.mp4" autoplay muted loop playsinline preload="auto"></video><div class="shade"></div>
<div id="login" class="box glass hide"><h1>Owner login</h1>
<form id="lform"><label for="user">Username</label><input type="text" id="user" autocomplete="username" required>
<label for="pass">Password</label><input type="password" id="pass" autocomplete="current-password" required>
<button class="btn pri" type="submit">Log in</button><div class="msg" id="lmsg"></div></form>
<div class="foot"><a href="/">← Back to site</a></div></div>
<div id="dash" class="wrap hide">
<h1>Dashboard</h1><p class="sub">Upload, edit or delete files. Only you can see this.</p>
<div class="btns"><a class="btn" href="/">View site</a><button class="btn del" id="logout">Log out</button></div>
<div class="drop glass" id="drop"><b>Drop .txt files here or tap to choose</b><span>Max about 700 KB per file</span></div>
<input type="file" id="file" accept=".txt,text/plain" multiple hidden>
<div class="msg" id="msg"></div><div class="glass" id="list"></div></div>
<dialog id="ed"><form id="eform"><h2>Edit file</h2><label for="ename">File name</label><input type="text" id="ename" maxlength="120" required>
<label for="etext">Text</label><textarea id="etext"></textarea><div class="btns"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" id="ecancel">Cancel</button></div></form></dialog>
<script src="/dashboard.js"></script></body></html>
