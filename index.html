<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revomaker System Share</title>
<style>
:root{--tx:#f2f0ec;--mu:#a9a6a0;--bd:rgba(255,255,255,.16);--glass:rgba(12,12,14,.55);--ac:#e8e6e1;--ac-tx:#0b0b0c;--glow:rgba(255,255,255,.35);--dg:#ff7a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--tx);font:16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;animation:bgin 1.6s ease both}
.shade{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.25),rgba(0,0,0,.78) 80%),linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.25) 40%,rgba(0,0,0,.7))}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);animation:scan 8s linear infinite}
@keyframes scan{to{background-position:0 60px}}
@keyframes bgin{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent,inset 0 0 0 0 transparent}50%{box-shadow:0 0 28px 0 var(--glow),inset 0 0 18px 0 rgba(255,255,255,.06)}}
.wrap{max-width:860px;margin:0 auto;padding:40px 16px 72px}
h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px;font-weight:800;line-height:1.1;background:linear-gradient(100deg,#fff 20%,#8f8d88 45%,#fff 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .9s .1s both,shimmer 6s linear infinite}
.sub{color:var(--mu);margin:0 0 26px;letter-spacing:.04em;animation:up .9s .25s both}
.drop{border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;padding:34px 16px;text-align:center;cursor:pointer;transition:transform .25s,border-color .25s;animation:up .9s .4s both,pulse 3.5s 1.5s ease-in-out infinite}
.drop:hover,.drop.over{transform:translateY(-3px) scale(1.01);border-color:#fff}
.drop b{display:block;margin-bottom:4px;letter-spacing:.05em}
.drop span{color:var(--mu);font-size:.9rem}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0;animation:up .8s .5s both}
.chip{border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx);border-radius:999px;padding:7px 16px;font:inherit;font-size:.9rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .2s,background .2s,color .2s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.panel{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:16px;overflow:hidden;animation:up .7s both}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd)}
.bar h2{font-size:1rem;margin:0;word-break:break-word;letter-spacing:.04em}
.bar small{color:var(--mu)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.btn.pri{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.btn.pri:hover{background:#fff}
.btn.del{color:var(--dg)}
pre{margin:0;padding:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font:15px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:68vh;overflow:auto;animation:up .9s .15s both}
.empty{color:var(--mu);text-align:center;padding:40px 0;animation:up .8s .5s both}
.msg{margin:12px 0;color:var(--mu);font-size:.9rem;min-height:1.3em}
.msg.err{color:var(--dg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>artifact-sync,artifact-local{display:contents}</style></head>
<body>
<video id="bgv" src="/_blob/c938805083852400e7e593c3b37de631" autoplay="" muted="" loop="" playsinline="" preload="auto"></video>
<div class="shade"></div><div class="grain"></div>
<div class="wrap">
  <h1>Revomaker System Share</h1>
  <p class="sub" id="sub">Upload a .txt file, then share this page so others can read it.</p>
  <div id="app"></div>
</div>
<script type="application/json" id="data">{"files":[{"id":"fmwfxau4o0","name":".owner-credentials.txt","text":"REVOMAKER STEAM — generated owner credentials\nStore these in a password manager, then delete this file.\nUpdated: 2026-11-12T00:00:00.000Z\n\nOwner:    Zak\nEmail:    owner@revomaker.steam\nPassword: eWUQPbLA6hmJyMF9AMzX82!\n\nOwner:    Co-Owner\nEmail:    coowner@revomaker.steam\nPassword: tCx3CMaBvtjXoMSyaPNC63!\n\nOwner:    Third Owner\nEmail:    third@revomaker.steam\nPassword: RevomakerThird#2026!xA9\n","added":"2026-11-14"}]}</script>
<script>
(function(){
  var MAX = 1500000;
  var state;
  try { state = JSON.parse(document.getElementById('data').textContent); } catch(e) { state = {files:[]}; }
  if (!state.files) state.files = [];
  var artifact = null, canEdit = false, busy = false, msg = '', msgErr = false;
  var app = document.getElementById('app');

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function currentFile(){
    var id = location.hash.slice(1);
    for (var i = 0; i < state.files.length; i++) if (state.files[i].id === id) return state.files[i];
    return state.files[0] || null;
  }
  function setMsg(t, err){ msg = t; msgErr = !!err; var m = document.getElementById('msg'); if (m){ m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); } }

  async function copy(text, okMsg){
    try { await navigator.clipboard.writeText(text); setMsg(okMsg); }
    catch(e){ setMsg('Copy didn’t work here. Select the text and copy it by hand.', true); }
  }

  async function save(){
    if (!artifact) return;
    busy = true;
    setMsg('Saving…');
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#app').innerHTML = '';
    clone.querySelector('#data').textContent = JSON.stringify(state).replace(/</g, '\\u003c');
    try {
      await artifact.publish('<!doctype html>\n' + clone.outerHTML);
    } catch(e){
      busy = false;
      setMsg(e && e.code === 'conflict' ? 'Someone else saved at the same time. Reloading…' : 'Couldn’t save. Try again.', true);
    }
  }

  async function addFiles(list){
    var added = 0;
    for (var i = 0; i < list.length; i++){
      var f = list[i];
      if (f.size > MAX){ setMsg('“' + f.name + '” is too big (max about 1.5 MB).', true); continue; }
      var text = await f.text();
      var id = 'f' + Date.now().toString(36) + i;
      state.files.push({id: id, name: f.name, text: text, added: new Date().toISOString().slice(0,10)});
      location.hash = id;
      added++;
    }
    if (added) await save();
  }

  async function removeFile(id){
    if (!confirm('Delete this file from the page?')) return;
    state.files = state.files.filter(function(f){ return f.id !== id; });
    history.replaceState(null, '', location.pathname + location.search);
    await save();
  }

  function render(){
    app.innerHTML = '';
    document.getElementById('sub').textContent = canEdit
      ? 'Upload a .txt file, then share this page so others can read it.'
      : 'Text files shared with you.';

    if (canEdit){
      var drop = el('div', 'drop');
      drop.appendChild(el('b', null, 'Drop .txt files here or tap to choose'));
      drop.appendChild(el('span', null, 'Max about 1.5 MB per file'));
      var input = document.createElement('input');
      input.type = 'file'; input.accept = '.txt,text/plain'; input.multiple = true; input.hidden = true;
      drop.onclick = function(){ if (!busy) input.click(); };
      input.onchange = function(){ if (input.files.length) addFiles(Array.prototype.slice.call(input.files)); };
      drop.ondragover = function(e){ e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = function(){ drop.classList.remove('over'); };
      drop.ondrop = function(e){ e.preventDefault(); drop.classList.remove('over'); if (!busy) addFiles(Array.prototype.slice.call(e.dataTransfer.files)); };
      app.appendChild(drop);
      app.appendChild(input);
    }

    var m = el('div', 'msg' + (msgErr ? ' err' : ''), msg);
    m.id = 'msg';
    app.appendChild(m);

    if (!state.files.length){
      app.appendChild(el('div', 'empty', canEdit ? 'No files yet. Upload your first one above.' : 'Nothing here yet.'));
      return;
    }

    var cur = currentFile();
    var chips = el('div', 'files');
    state.files.forEach(function(f){
      var b = el('button', 'chip' + (cur && f.id === cur.id ? ' on' : ''), f.name);
      b.onclick = function(){ location.hash = f.id; };
      chips.appendChild(b);
    });
    app.appendChild(chips);

    var panel = el('div', 'panel');
    var bar = el('div', 'bar');
    var left = el('div');
    left.appendChild(el('h2', null, cur.name));
    left.appendChild(el('small', null, cur.text.length.toLocaleString() + ' characters · added ' + cur.added));
    bar.appendChild(left);
    var btns = el('div', 'btns');
    var cl = el('button', 'btn pri', 'Copy link');
    cl.onclick = function(){ location.hash = cur.id; copy(location.href, 'Link copied. Make sure the page itself is shared first.'); };
    var ct = el('button', 'btn', 'Copy text');
    ct.onclick = function(){ copy(cur.text, 'Text copied.'); };
    btns.appendChild(cl); btns.appendChild(ct);
    if (canEdit){
      var d = el('button', 'btn del', 'Delete');
      d.onclick = function(){ removeFile(cur.id); };
      btns.appendChild(d);
    }
    bar.appendChild(btns);
    panel.appendChild(bar);
    var pre = document.createElement('pre');
    pre.textContent = cur.text;
    panel.appendChild(pre);
    app.appendChild(panel);
  }

  window.addEventListener('hashchange', render);
  render();

  (async function(){
    try {
      if (!window.claude || !window.claude.use) return;
      var results = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]);
      artifact = results[0];
      var user = results[1];
      canEdit = !!(artifact && user && user.canEdit && user.canEdit());
      render();
    } catch(e){ /* read-only view */ }
  })();
})();
</script>


</body></html>
